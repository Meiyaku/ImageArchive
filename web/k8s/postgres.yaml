# Postgres for imagearchive. The password comes from the imagearchive-secrets
# Secret, which scripts/deploy.sh creates on first deploy (it is not in git).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Run as the Alpine image's postgres user (70) so the entrypoint skips its
      # gosu step, which hung at 100% CPU on this cluster (2026-11-22). The data
      # directory is already owned by 70.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: imagearchive
            - name: POSTGRES_USER
              value: imagearchive
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imagearchive-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # After an unclean restart Postgres can take ~5 minutes to become ready
          # (lost wakeups, root cause open), so the startup probe allows up to
          # 15 minutes before liveness checks begin.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "imagearchive", "-d", "imagearchive"]
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "imagearchive", "-d", "imagearchive"]
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "imagearchive", "-d", "imagearchive"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
