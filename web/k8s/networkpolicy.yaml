# Only the app may reach Postgres; other pods in the cluster can't connect at all.
# k3s enforces NetworkPolicy with its built-in controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app-only
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: imagearchive
      ports:
        - protocol: TCP
          port: 5432
