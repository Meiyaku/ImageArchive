apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imagearchive-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagearchive
  labels:
    app: imagearchive
spec:
  replicas: 1
  # The uploads volume is ReadWriteOnce, so don't run old and new pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: imagearchive
  template:
    metadata:
      labels:
        app: imagearchive
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          # Pulled from the registry on the node itself. scripts/deploy.sh overrides
          # the tag with the git SHA via a Kustomize images: entry.
          image: localhost:5000/imagearchive:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imagearchive-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://imagearchive:$(POSTGRES_PASSWORD)@postgres:5432/imagearchive
            # Only used to create the first admin when the users table is empty.
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: imagearchive-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imagearchive-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # sharp decodes full-size photos in memory.
              memory: 768Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: imagearchive-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: imagearchive
  labels:
    app: imagearchive
spec:
  selector:
    app: imagearchive
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imagearchive
  labels:
    app: imagearchive
spec:
  ingressClassName: traefik
  rules:
    - host: imagearchive.snowborn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imagearchive
                port:
                  name: http
